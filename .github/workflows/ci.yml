name: CI

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements.txt
      # No torch / sentence-transformers: they are imported lazily and not needed by the tests.
      - run: pip install -r api/requirements.txt pytest rapidfuzz numpy beautifulsoup4 trafilatura
      - name: Pipeline tests (profiler)
        run: pytest tests -q
      - name: Match publication tests
        run: pytest eval/test_match_publication.py -q
      - name: Structured logging tests
        env:
          LLM_BASE_URL: http://127.0.0.1:9/v1/
          LLM_API_KEY: ci-placeholder
          LLM_MODEL: ci-test-model
        run: python eval/test_structured_logging.py
      - name: API tests (guard + rate limit)
        run: pytest api -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
